version: "3.9"

# ==============================================================================
# Self-Evolving Autonomous Research Agent — Docker Compose
# ==============================================================================
# Services:
#   - backend   : FastAPI application
#   - frontend  : Vite/React application (served via Nginx in production)
#   - postgres  : PostgreSQL relational database
#   - chromadb  : ChromaDB vector database for RAG
# ==============================================================================

networks:
  research_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local

services:

  # ----------------------------------------------------------------------------
  # PostgreSQL — Relational Database
  # Stores: research sessions, planner steps, governance audit logs, reports
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: research_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-research_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research_net

  # ----------------------------------------------------------------------------
  # ChromaDB — Vector Database
  # Stores: document embeddings, research memory, semantic search index
  # ----------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: research_chromadb
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8001
      - ANONYMIZED_TELEMETRY=false
    ports:
      - "${CHROMA_PORT:-8001}:8001"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - research_net

  # ----------------------------------------------------------------------------
  # Backend — FastAPI Application
  # Exposes: REST API on port 8000, WebSocket on /ws
  # Depends on: postgres, chromadb
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: research_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - CHROMA_HOST=chromadb
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount source for live-reload in development
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - research_net
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level info

  # ----------------------------------------------------------------------------
  # Frontend — Vite/React (Development server)
  # In production, replace with Nginx build target (see docker/Dockerfile.frontend)
  # Depends on: backend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: dev
    container_name: research_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - research_net
